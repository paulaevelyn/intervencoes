<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Aurora · Questionário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>
  // Caminho até as camadas compartilhadas: em produção esta página fica em /aurora/ e o resto em /;
  // no servidor local ela é aberta em /aurora/public/. Se o endereço tiver "/aurora/public/", sobe 2 níveis.
  var B = /\/aurora\/public\//.test(location.pathname) ? '../../' : '../';
  document.documentElement.classList.add('pea-auth-carregando');
  document.write('<link rel="stylesheet" href="' + B + 'shared/escala.css"><link rel="stylesheet" href="' + B + 'auth/auth.css">');
</script>
<style>
:root{--white:#FFFFFF;--graphite:#2F3A2F;--muted:#667266;--border:rgba(47,58,47,.16);--mint:#4d844d;--mint-d:#3A6B3A;--mint-l:#EAF2E6;--font:'Nunito Sans',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--white:#232B25;--graphite:#E8EFE8;--muted:#A9B5A9;--border:rgba(255,255,255,.18);--mint:#8CC08C;--mint-d:#A6D2A6;--mint-l:#2A382C}}
body{margin:0;background:#F6F8F4;color:var(--graphite);font-family:var(--font);line-height:1.55}
@media (prefers-color-scheme:dark){body{background:#1B211C}}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:1.5rem;font-weight:800;color:var(--mint-d);margin:6px 0 8px}
a.volta{display:inline-block;margin-bottom:10px;color:var(--mint-d);font-weight:700;text-decoration:none}
.nota{font-size:14px;color:var(--muted)}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.links a,.links button{padding:12px 20px;border-radius:12px;font:800 15px var(--font);text-decoration:none;background:var(--mint-d);color:#fff;border:0;cursor:pointer}
.links .sec{background:transparent;color:var(--mint-d);border:1.5px solid var(--border)}
.apoio{background:#FFF4E5;border:1.5px solid #F0B866;border-radius:16px;padding:16px;margin:10px 0 16px;color:#4A3410}
@media (prefers-color-scheme:dark){.apoio{background:#3A2E18;border-color:#B98A3E;color:#F5E6C8}}
.apoio h2{font-size:1.05rem;margin:0 0 6px}.apoio p{margin:0 0 8px;font-size:14.5px}.apoio a{color:inherit;font-weight:800}
.func{margin-top:6px}.func legend{font-size:15px;font-weight:700;margin-bottom:10px;line-height:1.45}
.func label{display:block;border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;background:var(--white)}
.func input{margin-right:8px}
</style>
</head>
<body>
<div id="pea-auth-aviso">carregando…</div>
<div class="wrap">
  <a class="volta" href="./" id="volta">← Voltar ao Aurora</a>
  <div id="area"></div>
</div>
<script>
  document.getElementById('volta').href = /\/aurora\/public\//.test(location.pathname) ? '../' : './';
  ['shared/escala.js', 'shared/escalas/phq9.js'].forEach(function (f) { document.write('<script src="' + B + f + '"><\/script>'); });
</script>
<script>
(function () {
  var CHAVE = 'depressao_app_escalas';
  var DEF = ESCALAS.phq9;
  var momento = new URLSearchParams(location.search).get('momento') === 'pos' ? 'pos' : 'pre';
  var area = document.getElementById('area');
  var APP = /\/aurora\/public\//.test(location.pathname) ? '../' : './';

  function ler() { try { return JSON.parse(localStorage.getItem(CHAVE)) || {}; } catch (e) { return {}; } }
  function gravar(estado) { try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch (e) { /* sem armazenamento */ } }
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt) e.textContent = txt; return e; }
  function botao(txt, cls, fn) { var b = el('button', cls, txt); b.type = 'button'; b.addEventListener('click', fn); return b; }
  function link(txt, href, cls) { var a = el('a', cls || '', txt); a.href = href; return a; }

  function semanasDesdePre() {
    var p = ler().pre; if (!p || !p.phq9 || !p.phq9.data) return null;
    return (Date.now() - new Date(p.phq9.data).getTime()) / (7 * 864e5);
  }

  // ── Apoio de crise: aparece NA HORA se o item 9 tiver qualquer resposta acima de 0 ──
  function blocoApoio() {
    var b = el('div', 'apoio'); b.setAttribute('role', 'alert');
    b.appendChild(el('h2', '', 'Obrigado/a por contar o que está sentindo'));
    b.appendChild(el('p', '', 'Você marcou que tem pensado em se ferir ou que seria melhor estar morto/a. Esses pensamentos são mais comuns do que parece, e você não precisa passar por isso sozinho/a.'));
    var p = el('p'); p.appendChild(document.createTextNode('Se você está em perigo agora, ligue '));
    var a1 = link('192 (SAMU)', 'tel:192'); p.appendChild(a1); p.appendChild(document.createTextNode(' ou vá a um pronto-socorro. Para conversar com alguém agora, ligue '));
    var a2 = link('188 (CVV, 24 horas, gratuito)', 'tel:188'); p.appendChild(a2); p.appendChild(document.createTextNode(', ou use o chat em '));
    var a3 = link('cvv.org.br', 'https://cvv.org.br'); a3.target = '_blank'; a3.rel = 'noopener'; p.appendChild(a3); p.appendChild(document.createTextNode('.'));
    b.appendChild(p);
    var mais = el('p'); mais.appendChild(document.createTextNode('Há mais informações na aba Aprender do app: ')); mais.appendChild(link('abrir "Em crise? Aqui está ajuda"', APP + '?tab=learn')); b.appendChild(mais);
    b.appendChild(el('p', '', 'Se você já tem acompanhamento, conte para a sua psicóloga ou psicólogo o quanto antes. Este aplicativo não envia o seu resultado nem nenhum alerta a ninguém: só quem você escolher compartilhar em "Minha conta" o vê, e isso não substitui uma conversa.'));
    return b;
  }

  function formulario() {
    area.textContent = '';
    area.appendChild(el('h1', '', momento === 'pre' ? 'Antes de começar' : 'Depois de um tempo'));
    area.appendChild(el('p', 'nota', momento === 'pre'
      ? 'Um questionário opcional, de uns 3 minutos, sobre como você tem se sentido nas últimas 2 semanas. Serve para você comparar, mais adiante. Não é um diagnóstico, e não há resposta certa.'
      : 'Se quiser, responda de novo ao mesmo questionário, para comparar com o do início. É opcional, e não há resposta certa.'));
    var form = el('div'); area.appendChild(form);
    Escala.render(form, DEF, {
      onDone: function (res) { perguntaFuncional(res); },
      onSkip: function () { location.href = APP; }
    });
  }

  function perguntaFuncional(res) {
    area.textContent = '';
    area.appendChild(el('h1', '', 'Só mais uma pergunta'));
    var campo = el('fieldset', 'func'); campo.style.border = '0'; campo.style.padding = '0'; campo.style.margin = '0';
    campo.appendChild(el('legend', '', DEF.funcional.pergunta));
    var escolhida = null;
    var seguir = botao('Concluir', '', function () { concluir(res, escolhida); });
    seguir.disabled = true; seguir.style.opacity = '.5';
    DEF.funcional.opcoes.forEach(function (rot, i) {
      var l = el('label'); var inp = el('input'); inp.type = 'radio'; inp.name = 'func'; inp.value = i;
      inp.addEventListener('change', function () { escolhida = i; seguir.disabled = false; seguir.style.opacity = '1'; });
      l.appendChild(inp); l.appendChild(document.createTextNode(rot)); campo.appendChild(l);
    });
    area.appendChild(campo);
    var l = el('div', 'links'); l.appendChild(seguir); l.appendChild(botao('Pular esta pergunta', 'sec', function () { concluir(res, null); }));
    area.appendChild(l);
  }

  function concluir(res, funcional) {
    var registro = {
      id: 'phq9', versao: DEF.versao, respostas: res.respostas, total: res.total, maximo: res.maximo,
      item9: res.respostas[DEF.itemRisco - 1], funcional: funcional, data: res.data
    };
    var e = ler(); e[momento] = e[momento] || {}; e[momento].phq9 = registro; gravar(e);
    resultado(registro, e);
  }

  function resultado(r, estado) {
    area.textContent = '';
    if (r.item9 > 0) area.appendChild(blocoApoio());
    area.appendChild(el('h1', '', 'Resposta registrada'));
    var caixa = el('div', 'esc-resultado');
    caixa.appendChild(el('p', 'nota', 'Sua pontuação'));
    caixa.appendChild(el('strong', '', r.total + ' de ' + r.maximo));
    caixa.appendChild(el('p', 'nota', 'Pontuações mais altas indicam mais sintomas nas últimas 2 semanas. É um retrato desse período, não um diagnóstico, e muda com o tempo.'));
    var pre = estado.pre && estado.pre.phq9;
    if (momento === 'pos' && pre) {
      var d = r.total - pre.total;
      caixa.appendChild(el('p', 'nota', 'No início você respondeu ' + pre.total + '. ' + (d === 0 ? 'Agora está igual.' : d < 0 ? 'Agora está ' + Math.abs(d) + (Math.abs(d) === 1 ? ' ponto abaixo.' : ' pontos abaixo.') : 'Agora está ' + d + (d === 1 ? ' ponto acima.' : ' pontos acima.') + ' Isso também acontece, e vale conversar sobre isso com um profissional.')));
    }
    area.appendChild(caixa);
    area.appendChild(el('p', 'nota', 'Mesmo que o número seja baixo, se você está se sentindo mal há algumas semanas, vale conversar com um profissional de saúde. Este aplicativo não envia o seu resultado a ninguém, a menos que você compartilhe em "Minha conta".'));
    var l = el('div', 'links');
    l.appendChild(link('Continuar', APP)); l.appendChild(link('Meu painel', 'meu-painel.html', 'sec'));
    area.appendChild(l);
  }

  function intro() {
    var sem = momento === 'pos' ? semanasDesdePre() : null;
    if (momento === 'pos' && sem === null) { location.replace('escala.html?momento=pre'); return; }
    if (sem !== null && sem < DEF.reaplicacaoSemanas) {
      area.textContent = '';
      area.appendChild(el('h1', '', 'Ainda é cedo'));
      area.appendChild(el('p', 'nota', 'Costuma-se esperar cerca de ' + DEF.reaplicacaoSemanas + ' semanas entre uma resposta e outra, para ver se algo mudou. ' + (sem < 1 ? 'Você respondeu há menos de uma semana.' : 'Você respondeu há ' + Math.floor(sem) + (Math.floor(sem) === 1 ? ' semana.' : ' semanas.'))));
      var l = el('div', 'links'); l.appendChild(link('Voltar ao Aurora', APP)); l.appendChild(botao('Responder mesmo assim', 'sec', formulario));
      area.appendChild(l); return;
    }
    formulario();
  }
  intro();
})();
</script>
<script>
  // LOGIN: camada compartilhada, injetada em tempo de execução (mesmo mecanismo do index do Aurora).
  (function () {
    var js = document.createElement('script');
    js.type = 'module'; js.src = new URL(B + 'auth/auth.js', location.href).href;
    js.dataset.app = 'aurora'; js.dataset.nome = 'Aurora'; js.dataset.pesquisa = 'nao';
    js.dataset.storageKeys = 'depressao_app_mood_history,depressao_app_activities_log,depressao_app_scheduled,depressao_app_gratitude,depressao_app_escalas,depressao_app_ob';
    document.body.appendChild(js);
  })();
</script>
</body>
</html>
