name: Publicar intervenções

# Publica TODO o site (apps estáticos + o Aurora, que precisa de build) no GitHub Pages.
# Requer: Settings → Pages → Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Aurora (React + Vite): compila para aurora/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: aurora/package-lock.json
      - name: Compilar o Aurora
        working-directory: aurora
        run: |
          npm ci
          npm run build

      # Monta o site: os apps estáticos entram como estão; o Aurora entra já compilado.
      - name: Montar o site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r farol floresca matiz seguranca-interna painel auth shared _site/
          cp -r aurora/dist _site/aurora
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
