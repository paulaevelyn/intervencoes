    <ellipse cx="69.5" cy="30.5" rx="6" ry="10.5" fill="#F9B15C" transform="rotate(45 69.5 30.5)"/>
    <ellipse cx="21.5" cy="49" rx="11" ry="6" fill="#F9B15C"/>
